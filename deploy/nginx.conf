server {
    listen 8000;
    listen [::]:8000;
    server_name luxdriveexotics.com www.luxdriveexotics.com;
    return 301 https://vehbikaraagac.com/luxdrive$request_uri;
}
server {
    listen 8000;
    listen [::]:8000;
    server_name www.vehbikaraagac.com;
    return 301 https://vehbikaraagac.com$request_uri;
}
server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name vehbikaraagac.com vehbi-portfolio.exe.xyz;
    absolute_redirect off;
    root /srv/www/portfolio;
    index index.html;
    location = /clockblocked { return 301 /clockblocked/; }
    location /clockblocked/ {
        root /srv/www/projects;
        try_files $uri $uri/ =404;
    }
    location = /anunnaki { return 301 /anunnaki/; }
    location = /anunnaki/api/partnership {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8101/api/partnership;
    }
    location /anunnaki/ {
        root /srv/www/projects;
        try_files $uri $uri.html $uri/ =404;
    }
    location = /shiny-carpet-cleaning { return 301 /shiny-carpet-cleaning/; }
    location = /shiny-carpet-cleaning/_submit {
        client_max_body_size 20m;
        proxy_ssl_server_name on;
        proxy_set_header Host shiny-carpet-cleaning-va.netlify.app;
        proxy_pass https://shiny-carpet-cleaning-va.netlify.app/;
    }
    location /shiny-carpet-cleaning/ { root /srv/www/projects; try_files $uri $uri/ =404; }
    location = /luxdrive { return 301 /luxdrive/; }
    location /luxdrive/ { root /srv/www/projects; try_files $uri $uri.html $uri/ =404; }
    location = /secret { return 301 /secret/; }
    location = /secrets { return 301 /secret/; }
    location = /secrets/ { return 301 /secret/; }
    location /medlaunch/ { return 302 /secret$request_uri; }
    location /secret/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
    location = /secret/stoic-poitras { return 301 /secret/stoic-poitras/; }
    location /secret/stoic-poitras/ {
        root /srv/www/projects;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /secret/stoic-poitras/index.html;
    }
    location = /secret/codilingual { return 301 /secret/codilingual/; }
    location /secret/codilingual/ {
        root /srv/www/projects;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /secret/codilingual/index.html;
    }
    location = /secret/stoic-allen { return 301 /secret/stoic-allen/; }
    location /secret/stoic-allen/ {
        root /srv/www/projects;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /secret/stoic-allen/index.html;
    }
    location = /secret/admiring-leavitt { return 301 /secret/admiring-leavitt/; }
    location /secret/admiring-leavitt/ {
        root /srv/www/projects;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /secret/admiring-leavitt/index.html;
    }
    location = /secret/medlaunch { return 301 /secret/medlaunch/; }
    location /secret/medlaunch/ {
        root /srv/www/projects;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /secret/medlaunch/index.html;
    }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
