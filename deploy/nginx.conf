server {
    listen 8000;
    listen [::]:8000;
    server_name www.vehbikaraagac.com;
    return 301 https://vehbikaraagac.com$request_uri;
}
server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name vehbikaraagac.com vehbi-portfolio.exe.xyz;
    absolute_redirect off;
    root /srv/www/portfolio;
    index index.html;
    location = /clockblocked { return 301 /clockblocked/; }
    location /clockblocked/ {
        root /srv/www/projects;
        try_files $uri $uri/ =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
